<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Objects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1b19;
  --ink-2:#6b6862;
  --ink-3:#a3a09a;
  --panel:rgba(252,251,249,0.93);
  --line:rgba(0,0,0,0.055);
  --line-2:rgba(0,0,0,0.10);
  --fillbg:#f1efeb;
  --fillfg:#e2dfd8;
  --rose:#c0787c;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --r:20px;
  --gut-t:60px;   /* gutter above the canvas — holds the + / settings buttons */
  --gut-b:92px;   /* gutter below the canvas — holds the wrap button */
  --gut-x:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:linear-gradient(160deg,#FAFAF8,#F7F6F3);
  color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-weight:300;
  font-size:12px;
  -webkit-font-smoothing:antialiased;
  touch-action:none;
}
canvas{display:block}

/* ── stage: the 16:10 working canvas, centred as a card ─ */
.stage{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(var(--gut-t) + var(--safe-t));
  aspect-ratio:16 / 10;
  width:min(
    calc(100vw - 2 * var(--gut-x)),
    calc((100dvh - var(--gut-t) - var(--gut-b) - var(--safe-t) - var(--safe-b)) * 1.6)
  );
}
.frame{
  position:absolute;inset:0;border-radius:var(--r);overflow:hidden;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 30px 70px -28px rgba(0,0,0,.22);
}
.frame canvas{position:absolute;inset:0;width:100%;height:100%}
.brand,.topright,.play,.panel{z-index:5}

.brand{
  position:absolute;bottom:100%;left:3px;margin-bottom:18px;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);transition:color .4s var(--ease);
}

.iconbtn{
  appearance:none;border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--ink-2);width:38px;height:38px;border-radius:13px;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 18px -8px rgba(0,0,0,.10);
  transition:transform .35s var(--ease),color .3s var(--ease),box-shadow .35s var(--ease);
}
.iconbtn:hover{color:var(--ink);box-shadow:0 2px 4px rgba(0,0,0,.04),0 12px 26px -10px rgba(0,0,0,.16)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}

.topright{position:absolute;bottom:100%;right:0;margin-bottom:11px;display:flex;gap:8px}

/* play */
.play{
  position:absolute;left:50%;top:100%;margin-top:18px;transform:translateX(-50%);
  height:52px;min-width:52px;padding:0 22px;border-radius:26px;
  border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--ink-2);cursor:pointer;
  display:flex;align-items:center;gap:10px;
  font:300 11px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px -12px rgba(0,0,0,.20);
  transition:transform .4s var(--ease),color .3s var(--ease),box-shadow .4s var(--ease),opacity .4s var(--ease);
}
.play:hover{color:var(--ink);transform:translateX(-50%) translateY(-2px);box-shadow:0 2px 6px rgba(0,0,0,.04),0 18px 40px -14px rgba(0,0,0,.26)}
.play:active{transform:translateX(-50%) scale(.975)}
.play svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── panel ──────────────────────────────────────────── */
.panel{
  position:absolute;background:var(--panel);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 24px 60px -20px rgba(0,0,0,.22);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .55s var(--ease),opacity .35s var(--ease);
}
/* desktop: right rail overlapping the canvas */
@media (min-width:780px){
  .panel{top:12px;right:12px;bottom:12px;width:288px}
  .panel[hidden-state]{transform:translateX(calc(100% + 28px));opacity:0;pointer-events:none}
}
/* mobile: bottom sheet overlapping the canvas */
@media (max-width:779px){
  .panel{
    left:10px;right:10px;bottom:10px;
    height:min(58vh,430px);max-height:calc(100% - 16px);border-radius:18px;
  }
  .panel[hidden-state]{transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none}
  /* the sheet sits where the play button lives — get it out of the way */
  body:has(.panel:not([hidden-state])) .play{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
}

.phead{display:flex;align-items:center;gap:2px;padding:12px 12px 0}
.tabs{display:flex;gap:2px;flex:1}
.tab{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font:300 11px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;
  color:var(--ink-3);padding:7px 9px;border-radius:9px;
  transition:color .3s var(--ease),background .3s var(--ease);
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--fillbg)}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.pane{display:none;flex-direction:column;gap:7px}
.pane.on{display:flex}

/* slider row */
.ctrl{
  position:relative;height:36px;border-radius:11px;background:var(--fillbg);
  overflow:hidden;display:flex;align-items:center;padding:0 11px;cursor:ew-resize;
  user-select:none;-webkit-user-select:none;
}
.ctrl::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:var(--fill,0%);
  background:var(--fillfg);transition:width .06s linear;
}
.ctrl > span{position:relative;color:var(--ink-2);letter-spacing:.02em}
.ctrl > b{position:relative;margin-left:auto;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.ctrl input[type=range]{
  position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;
  -webkit-appearance:none;appearance:none;background:transparent;
}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:36px}

/* plain rows */
.row{display:flex;align-items:center;gap:10px;height:32px;padding:0 11px;color:var(--ink-2)}
.row label{flex:1;letter-spacing:.02em;cursor:pointer}
.row input[type=number],.row input[type=text]{
  width:64px;border:0;border-bottom:1px solid var(--line-2);background:transparent;
  font:400 12px/1 "IBM Plex Mono",monospace;color:var(--ink);text-align:right;padding:3px 2px;
  outline:none;transition:border-color .3s var(--ease);
}
.row input[type=text]{width:110px;text-align:left;color:var(--ink-3)}
.row input:focus{border-color:var(--ink-3);color:var(--ink)}
.row input[type=checkbox]{
  appearance:none;width:15px;height:15px;border:1px solid var(--line-2);border-radius:5px;
  background:#fff;cursor:pointer;position:relative;margin:0 6px 0 0;flex:none;
  transition:background .25s var(--ease),border-color .25s var(--ease);
}
.row input[type=checkbox]:checked{background:var(--ink-2);border-color:var(--ink-2)}
.row input[type=checkbox]:checked::after{
  content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 1.4px 1.4px 0;transform:rotate(42deg);
}
.row.tog{padding-left:11px}
.row.tog label{order:2}
.swatch{
  width:19px;height:19px;border-radius:6px;border:1px solid var(--line-2);
  padding:0;overflow:hidden;cursor:pointer;flex:none;background:none;
}
.swatch input{opacity:0;width:40px;height:40px;margin:-10px;cursor:pointer;border:0;padding:0}
.hex{width:74px!important;text-align:left!important;color:var(--ink-2)!important}

.sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:12px 11px 3px}
.sec:first-child{padding-top:2px}

/* images */
.drop{
  border:1px dashed var(--line-2);border-radius:14px;padding:20px 12px;text-align:center;
  color:var(--ink-3);cursor:pointer;line-height:1.7;
  transition:border-color .3s var(--ease),background .3s var(--ease),color .3s var(--ease);
}
.drop:hover,.drop.over{border-color:var(--ink-3);color:var(--ink-2);background:rgba(0,0,0,.015)}
.drop em{font-style:normal;color:var(--ink-2)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.thumb{
  position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--fillbg);
  border:1px solid var(--line);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{
  position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:7px;border:0;
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);color:var(--ink-2);
  cursor:pointer;display:grid;place-items:center;padding:0;
  opacity:0;transition:opacity .25s var(--ease),transform .25s var(--ease);
}
.thumb button svg{width:9px;height:9px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.thumb:hover button{opacity:1}
@media (hover:none){.thumb button{opacity:.85}}

.btn{
  appearance:none;border:1px solid var(--line-2);background:#fff;border-radius:11px;
  height:34px;padding:0 14px;cursor:pointer;color:var(--ink-2);
  font:300 11px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;
  transition:transform .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease);
}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn.quiet{border-color:rgba(192,120,124,.35);color:var(--rose)}
.btn.quiet:hover{border-color:var(--rose)}
.btnrow{display:flex;gap:6px;margin-top:6px}
.btnrow .btn{flex:1}

.hint{color:var(--ink-3);padding:2px 11px;line-height:1.75}

/* full-window drop veil */
.veil{
  position:fixed;inset:0;z-index:20;display:none;place-items:center;
  background:rgba(250,250,248,.82);backdrop-filter:blur(4px);
  color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;font-size:11px;
}
.veil.on{display:grid}

.toast{
  position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(8px);
  background:rgba(28,27,25,.92);color:#fff;border-radius:999px;padding:9px 16px;
  font-size:11px;letter-spacing:.06em;backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease);
  z-index:30;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (hover:none){.iconbtn:hover,.play:hover,.btn:hover{transform:none}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="frame" id="frame"></div>
  <div class="brand" id="brand">Objects</div>
  <div class="topright">
    <button class="iconbtn" id="addBtn" title="Add images" aria-label="Add images">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="iconbtn" id="gearBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.6 0z"/></svg>
    </button>
  </div>

  <button class="play" id="playBtn">
    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z"/></svg>
    <span id="playLabel">Wrap</span>
  </button>

  <div class="panel" id="panel" hidden-state>
    <div class="phead">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-pane="images" aria-selected="true">Images</button>
        <button class="tab" role="tab" data-pane="grid" aria-selected="false">Grid</button>
        <button class="tab" role="tab" data-pane="globe" aria-selected="false">Globe</button>
      </div>
      <button class="iconbtn" id="closeBtn" style="width:30px;height:30px;border:0;background:transparent;box-shadow:none" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="pbody">
      <div class="pane on" data-pane="images">
        <div class="drop" id="drop">
          Drop photos, GIFs or clips here<br><em>or tap to choose</em>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <div class="btnrow">
          <button class="btn" id="demoBtn">Demo set</button>
          <button class="btn quiet" id="clearBtn">Clear</button>
        </div>
        <div class="hint" id="count"></div>
      </div>

      <div class="pane" data-pane="grid">
        <div class="sec">Layout</div>
        <div class="row"><label for="cols">Columns</label><input type="number" id="cols" min="2" max="16" step="1"></div>
        <div class="row"><label for="rows">Rows</label><input type="number" id="rows" min="2" max="40" step="1"></div>
        <div data-slider="gap" data-label="Gap" data-min="0" data-max="0.3" data-step="0.005" data-fmt="%"></div>
        <div data-slider="offset" data-label="Offset" data-min="0" data-max="1" data-step="0.02" data-fmt="%"></div>
        <div data-slider="spread" data-label="Width" data-min="0.8" data-max="3" data-step="0.05" data-fmt="x"></div>
        <div data-slider="drift" data-label="Speed" data-min="0" data-max="0.06" data-step="0.002" data-fmt="x"></div>
        <div class="sec">Frame</div>
        <div data-slider="crop" data-label="Crop" data-min="0" data-max="1" data-step="0.01" data-fmt="%"></div>
        <div data-slider="radius" data-label="Radius" data-min="0" data-max="0.5" data-step="0.01" data-fmt="%"></div>
        <div class="sec">Page</div>
        <div class="row"><label>Backdrop</label>
          <span class="swatch"><input type="color" id="bgColor"></span>
          <input type="text" class="hex" id="bgHex" spellcheck="false">
        </div>
        <div class="btnrow"><button class="btn quiet" id="resetBtn">Reset all</button></div>
      </div>

      <div class="pane" data-pane="globe">
        <div class="sec">Shape</div>
        <div data-slider="globeSize" data-label="Size" data-min="0.2" data-max="0.7" data-step="0.01" data-fmt="%"></div>
        <div data-slider="tileScale" data-label="Tiles" data-min="0.4" data-max="2" data-step="0.02" data-fmt="x"></div>
        <div data-slider="taper" data-label="Taper" data-min="0" data-max="1" data-step="0.02" data-fmt="%"></div>
        <div class="sec">Motion</div>
        <div data-slider="spin" data-label="Spin" data-min="-0.6" data-max="0.6" data-step="0.01" data-fmt="x"></div>
        <div data-slider="tilt" data-label="Tilt" data-min="-0.5" data-max="0.5" data-step="0.01" data-fmt="x"></div>
        <div data-slider="dur" data-label="Morph" data-min="0.5" data-max="4" data-step="0.05" data-fmt="s"></div>
        <div data-slider="stagger" data-label="Stagger" data-min="0" data-max="1.2" data-step="0.02" data-fmt="%"></div>
        <div data-slider="bulge" data-label="Bulge" data-min="-0.6" data-max="0.8" data-step="0.02" data-fmt="%"></div>
        <div class="row tog"><input type="checkbox" id="backs"><label for="backs">Show tile backs</label></div>
        <div class="sec">Loop</div>
        <div class="row tog"><input type="checkbox" id="loop"><label for="loop">Auto loop</label></div>
        <div data-slider="dwell" data-label="Hold" data-min="1" data-max="12" data-step="0.5" data-fmt="s"></div>
      </div>

    </div>
  </div>
</div>

<div class="veil" id="veil">Drop to add</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*,video/*,.mov,.gif" multiple hidden>

<!-- classic scripts, not modules: those are CORS-blocked on file://,
     so this page opens by double-click as well as over http -->
<script src="./vendor/three.global.js"></script>
<script src="./app.js"></script>
</body>
</html>
